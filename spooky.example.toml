# Copy to spooky.toml and change only what you need. Defaults are in spooky/config.py.

[leds]
# Wiring order along the data line, starting at the Pi
chain = [["left_ring", 16], ["left_pupil", 1], ["right_ring", 16], ["right_pupil", 1]]
# Which physical LED of each ring sits at 12 o'clock (seen from the front), [left, right]
ring_offset = [0, 0]
ring_clockwise = [true, true]
brightness = 0.4
max_current_a = 1.7

[camera]
rotate = "ccw"
gaze_mirror = true   # flip if the eyes look away from visitors

[show]
awake_timeout = 20.0
face_hold = 4.0          # lock-on time before the countdown (3-5 s avoids false triggers)
hold_still_after = 1.0   # "hold still!" cue this far into the lock-on
countdown = 3.0
display_seconds = 12.0
rearm = 6.0
save_photos = true
keep_photos = 1000

[display]
backend = "stream"   # stream (i.MX over Ethernet) | pygame | file | none
size = [1920, 1080]   # display resolution
stream_port = 8090
rotate = 0
