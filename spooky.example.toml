# Copy to spooky.toml and change only what you need. Defaults are in spooky/config.py.

[leds]
# Wiring order along the data line, starting at the Teensy. Pupils are optional:
# [["left_ring", 16], ["left_pupil", 1], ["right_ring", 16], ["right_pupil", 1]]
chain = [["left_ring", 16], ["right_ring", 16]]
# Which physical LED of each ring sits at 12 o'clock (seen from the front), [left, right]
ring_offset = [0, 0]
ring_clockwise = [true, true]
brightness = 0.4
max_current_a = 2.0

[handpiece]
leds = 8                 # strip on Teensy pin 8; 0 = not fitted
brightness = 0.4
# looks = { REVEAL = "strobe:#00ff00", IDLE = "off" }   names: spooky/handpiece.py

[camera]
rotate = "ccw"
gaze_mirror = true   # flip if the eyes look away from visitors

[show]
wake_on_face = true      # camera watches while idle; a face wakes the show
awake_timeout = 20.0
face_hold = 2.0          # lock-on time before the countdown; face_hold + countdown = 5 s to the photo
hold_still_after = 1.0   # "hold still!" cue this far into the lock-on
countdown = 3.0
display_seconds = 12.5   # before/after stays up 2.5 s reveal + this = 15 s
rearm = 6.0
save_photos = true
keep_photos = 1000

[display]
backend = "web"      # web (the visitor page on [web] port, for the Pi's HDMI kiosk) | pygame | file | none
size = [1920, 1080]   # display resolution
rotate = 0

[web]
port = 8090          # visitor screen (/), camera view (/camera), control API (/api): docs/EYES.md

[imx]
host = "192.168.77.2"   # the i.MX 8M Plus, which plays animations on its own display; "" = off
port = 5005
# Animation sent when the show enters each state ("" = none). Protocol: imx/README.md
# animations = { REVEAL = "scare", SHOWING = "" }
